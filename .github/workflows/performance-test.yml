name: JMeter NGINX Load Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start NGINX container
        run: |
          docker run -d --name local-nginx -p 8080:80 nginx
          sleep 5
          curl -I http://localhost:8080/

      - name: Install Apache JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Run JMeter load test
        run: |
          apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t nginx-load-test.jmx \
            -l results-${{ github.run_number }}.jtl \
            -e \
            -o report-${{ github.run_number }}

      - name: Upload JMeter HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report-${{ github.run_number }}
          path: report-${{ github.run_number }}/

      - name: Upload raw JMeter results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-raw-results-${{ github.run_number }}
          path: results-${{ github.run_number }}.jtl
